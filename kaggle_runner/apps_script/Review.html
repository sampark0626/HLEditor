<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_blank">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HLEditor 검토</title>
<!--
  HLEditor 경기 검토 페이지 — Apps Script 웹 앱(접근: 나만)으로 배포한다. 설계: MONTHLY_PLAN.md 3-5
  Code.gs의 서버 함수(reviewList·reviewGetDay·reviewSetGame·reviewTagClip·reviewPublish)만 부른다.
  화면은 서버가 계산해 준 상태(공격/수비·월간 대상 …)를 그대로 그린다 — 규칙은 서버(Code.gs)에만 있다.
  글자는 16px 이상, 누르는 곳은 44px 이상. 저장은 누를 때마다 하고, 실패하면 화면은 그대로(서버 상태)이고 알림을 띄운다.
-->
<style>
  :root {
    --bg: #f4f6f8; --card: #ffffff; --text: #17202a; --muted: #5d6b79; --line: #d6dde4;
    --accent: #0b6bcb; --accent-text: #ffffff; --ok: #1a7f37; --warn: #9a6700; --bad: #c62828;
    --chip: #e8eef4; --on: #0b6bcb; --on-text: #ffffff; --off-bg: #fdecea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10161c; --card: #19222b; --text: #e8eef4; --muted: #9bacbc; --line: #2c3946;
      --accent: #4da3ff; --accent-text: #08121c; --ok: #4cc26b; --warn: #e3b341; --bad: #ff7b72;
      --chip: #25313d; --on: #4da3ff; --on-text: #08121c; --off-bg: #3a1f1f;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 12px 16px 96px; }
  header.top { display: flex; align-items: center; gap: 8px; margin: 4px 0 12px; }
  header.top h1 { flex: 1; margin: 0; font-size: 20px; }
  h2 { margin: 20px 0 8px; font-size: 17px; }
  button { font: inherit; color: inherit; min-height: 44px; padding: 8px 14px; border-radius: 10px;
           border: 1px solid var(--line); background: var(--card); cursor: pointer; touch-action: manipulation; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  button.seg { min-width: 64px; }
  button[aria-pressed="true"] { background: var(--on); color: var(--on-text); border-color: var(--on); font-weight: 600; }
  button.danger[aria-pressed="true"] { background: var(--bad); border-color: var(--bad); color: #fff; }
  button.link { border: none; background: none; color: var(--accent); padding: 8px 4px; min-height: 44px; text-decoration: underline; }
  a { color: var(--accent); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin: 0 0 16px; }
  .card.busy { opacity: .6; pointer-events: none; }
  .card h3 { margin: 0 0 4px; font-size: 18px; word-break: break-all; }
  .sub, .hint { color: var(--muted); font-size: 15px; }
  .hint { margin: 6px 0; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 10px 0; }
  .row > label { flex-basis: 100%; font-weight: 600; font-size: 15px; }
  .chip { display: inline-block; padding: 2px 10px; border-radius: 999px; background: var(--chip); font-size: 14px; }
  .chip.ok { color: var(--ok); } .chip.warn { color: var(--warn); } .chip.bad { color: var(--bad); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips button { min-height: 40px; border-radius: 999px; background: var(--chip); }
  input[type=text] { font: inherit; width: 100%; min-height: 44px; padding: 8px 12px; border-radius: 10px;
                     border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  ul.clips { list-style: none; margin: 8px 0 0; padding: 0; }
  li.clip { border-top: 1px solid var(--line); padding: 10px 0; }
  li.clip.removed .title { text-decoration: line-through; color: var(--muted); }
  li.clip .title { display: block; width: 100%; text-align: left; border: none; background: none; padding: 6px 0; font-weight: 600; }
  li.clip .tags { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  li.clip .month { font-size: 14px; color: var(--muted); }
  li.clip .month.in { color: var(--ok); }
  .preview { margin: 8px 0 4px; }
  .preview iframe { width: 100%; aspect-ratio: 16 / 9; border: 0; border-radius: 10px; background: #000; }
  .box { border-radius: 10px; padding: 10px 12px; margin: 10px 0; font-size: 15px; }
  .box.err { background: var(--off-bg); color: var(--bad); }
  .box.info { background: var(--chip); }
  .bar { margin-top: 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .bar button.primary { flex: 1 1 220px; min-height: 52px; font-size: 17px; }
  #toast { position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 10; padding: 12px 14px; border-radius: 12px;
           background: #202b36; color: #fff; display: none; box-shadow: 0 4px 16px rgba(0,0,0,.35); }
  #toast.show { display: block; } #toast.bad { background: var(--bad); }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <button id="back" class="link" hidden>← 목록</button>
    <h1 id="title">HLEditor 검토</h1>
    <button id="refresh" aria-label="새로고침">새로고침</button>
  </header>
  <main id="app"><p class="sub">불러오는 중…</p></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';
  var INITIAL = <?!= initial ?>;
  var STATUS = {
    pending: ['검토 대기', 'warn'], publish: ['게시 대기', 'warn'], running: ['게시 중', 'warn'],
    published: ['게시됨', 'ok'], auto_published: ['자동 게시됨', 'ok'], failed: ['게시 실패', 'bad']
  };
  var MONTHLY = {
    none: ['아직 안 만듦', ''], waiting_tags: ['태깅 대기', 'warn'], build: ['만들기 대기', 'warn'],
    running: ['만드는 중', 'warn'], done: ['완료', 'ok'], failed: ['실패', 'bad']
  };
  var app = document.getElementById('app');
  var state = {view: 'list', list: null, date: '', day: null, month: '', monthData: null, open: {}, busy: {},
               confirm: {}, timer: null, poll: null};
  var queue = Promise.resolve();

  // ── 서버 호출: Promise로 감싸고, 한 번에 하나씩 순서대로 보낸다(연달아 눌러도 서버에서 뒤섞이지 않게) ──
  function run(name) {
    var args = Array.prototype.slice.call(arguments, 1);
    var p = queue.then(function () {
      return new Promise(function (resolve, reject) {
        var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) { reject(e); });
        r[name].apply(r, args);
      });
    });
    queue = p.catch(function () {});
    return p;
  }

  // ── DOM 도우미: 서버가 준 문자열은 항상 textContent로 넣는다(innerHTML을 쓰지 않는다) ──
  function h(tag, attrs) {
    var el = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      var v = attrs[k];
      // aria-pressed·aria-expanded는 true/false 문자열이어야 한다(빈 속성으로 두면 CSS·화면 낭독이 눌림 상태를 못 읽는다)
      if (k.indexOf('aria-') === 0 && typeof v === 'boolean') { el.setAttribute(k, String(v)); return; }
      if (v === null || v === undefined || v === false) return;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k.indexOf('on') === 0) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : String(v));
    });
    for (var i = 2; i < arguments.length; i++) add(el, arguments[i]);
    return el;
  }
  function add(el, c) {
    if (c === null || c === undefined || c === false) return;
    if (Array.isArray(c)) c.forEach(function (x) { add(el, x); });
    else el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  function toast(msg, bad) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.className = 'show' + (bad ? ' bad' : '');
    clearTimeout(toast.t); toast.t = setTimeout(function () { t.className = ''; }, bad ? 7000 : 3000);
  }
  function errText(e) { return String((e && e.message) || e || '알 수 없는 오류').replace(/^Error:\s*/, ''); }

  function fmtSec(s) { s = Math.round(s || 0); return s >= 60 ? Math.floor(s / 60) + '분 ' + (s % 60) + '초' : s + '초'; }
  function fmtClock(s) { s = Math.round(s || 0); return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }
  function fmtDate(d) {
    var w = ['일', '월', '화', '수', '목', '금', '토'][new Date(d + 'T12:00:00+09:00').getDay()];
    return Number(d.slice(5, 7)) + '월 ' + Number(d.slice(8, 10)) + '일 (' + w + ')';
  }
  function fmtMonth(m) { return m.slice(0, 4) + '년 ' + Number(m.slice(5, 7)) + '월'; }
  function fmtAuto(at) {
    var m = /^\d{4}-(\d\d)-(\d\d)T(\d\d)/.exec(at || '');
    return m ? Number(m[1]) + '/' + Number(m[2]) + ' 오전 ' + Number(m[3]) + '시' : '';
  }
  function ready(g) { return !!g.kind && (g.kind !== 'opponent' || !!g.opponent.trim()); }

  // ── 목록 화면 ──
  function showList() {
    stopPoll(); state.view = 'list'; state.day = null; state.monthData = null;
    document.getElementById('back').hidden = true;
    document.getElementById('title').textContent = 'HLEditor 검토';
    app.replaceChildren(h('p', {class: 'sub', text: '불러오는 중…'}));
    run('reviewList').then(function (list) { state.list = list; renderList(); }).catch(function (e) {
      app.replaceChildren(h('div', {class: 'box err', text: '목록을 불러오지 못했습니다: ' + errText(e)}));
    });
  }
  function renderList() {
    var list = state.list, out = [];
    if (!list.days.length) out.push(h('p', {class: 'sub', text: '아직 분석이 끝난 경기가 없습니다. 영상을 올리면 여기에 나타납니다.'}));
    if ((list.months || []).length) {
      out.push(h('h2', {text: '월간 영상'}));
      list.months.forEach(function (m) {
        var st = MONTHLY[m.status] || [m.status, ''];
        out.push(h('div', {class: 'card'},
          h('h3', {text: fmtMonth(m.month)}),
          h('div', {class: 'row'},
            h('span', {class: 'chip ' + st[1], text: st[0]}),
            m.untagged ? h('span', {class: 'chip warn', text: '태깅 안 된 경기 ' + m.untagged + '개'}) : null,
            h('span', {class: 'sub', text: '경기 ' + m.games + '개'})),
          h('div', {class: 'bar'}, h('button', {class: m.status === 'waiting_tags' ? 'primary' : '', text: '월간 보기',
            onclick: function () { openMonth(m.month); }}))));
      });
    }
    list.days.forEach(function (day) {
      out.push(h('h2', {text: fmtDate(day.date)}));
      day.games.forEach(function (g) {
        var st = STATUS[g.status] || [g.status, ''];
        out.push(h('div', {class: 'card'},
          h('h3', {text: g.name}),
          h('div', {class: 'row'},
            h('span', {class: 'chip ' + st[1], text: st[0]}),
            g.attention && g.status === 'pending' ? h('span', {class: 'chip warn', text: '검토 필요'}) : null,
            g.attention && g.status === 'auto_published' ? h('span', {class: 'chip warn', text: '태깅 안 함'}) : null,
            g.clips ? h('span', {class: 'sub', text: '클립 ' + g.clips + '개'}) : null),
          g.status === 'pending' && g.autoAt
            ? h('div', {class: 'hint', text: fmtAuto(g.autoAt) + '까지 게시하지 않으면 전체 장면으로 자동 게시됩니다.'}) : null,
          h('div', {class: 'bar'}, h('button', {class: g.attention ? 'primary' : '', text: g.attention ? '검토하기' : '보기',
            onclick: function () { openDay(day.date); }}))));
      });
    });
    app.replaceChildren.apply(app, out);
  }

  // ── 월간 화면: 그달 경기의 태깅 현황, 월간 상태, "월간 다시 만들기" ──
  function openMonth(month) {
    stopPoll(); state.view = 'month'; state.month = month; state.monthData = null; state.confirm = {};
    document.getElementById('back').hidden = false;
    document.getElementById('title').textContent = fmtMonth(month) + ' 월간';
    app.replaceChildren(h('p', {class: 'sub', text: '불러오는 중…'}));
    loadMonth(false);
  }
  function loadMonth(quiet) {
    var month = state.month;
    return run('reviewMonth', month).then(function (data) {
      if (state.view !== 'month' || state.month !== month) return;
      state.monthData = data; renderMonth(); schedulePoll();
    }).catch(function (e) {
      if (quiet) return;
      app.replaceChildren(h('div', {class: 'box err', text: '불러오지 못했습니다: ' + errText(e)}));
    });
  }
  function renderMonth() {
    var d = state.monthData, m = d.monthly, st = MONTHLY[m.status] || [m.status, ''], out = [];
    var working = m.status === 'build' || m.status === 'running';
    var card = h('article', {class: 'card' + (state.busy.month ? ' busy' : '')});
    card.appendChild(h('h3', {text: fmtMonth(d.month) + ' 하이라이트'}));
    card.appendChild(h('div', {class: 'row'}, h('span', {class: 'chip ' + st[1], text: st[0]}),
      m.pickedCount ? h('span', {class: 'sub', text: '장면 ' + m.pickedCount + '개' + (m.durationSec ? ' · ' + fmtSec(m.durationSec) : '')}) : null));
    if (m.ytUrl) card.appendChild(h('div', {class: 'row'}, h('a', {href: m.ytUrl, text: 'YouTube에서 보기 ↗', rel: 'noopener'})));
    if (m.driveLink) card.appendChild(h('div', {class: 'row'}, h('a', {href: m.driveLink, text: 'Drive에서 열기 ↗', rel: 'noopener'})));
    if (m.status === 'done' && !m.ytUrl) card.appendChild(h('div', {class: 'box err', text: 'YouTube 업로드는 실패해 Drive에만 있습니다. 다시 만들면 YouTube에도 올립니다.'}));
    if (m.error) card.appendChild(h('div', {class: 'box err', text: m.error}));
    if (m.status === 'waiting_tags') {
      card.appendChild(h('div', {class: 'box info', text: '태깅 안 된 경기를 모두 태깅하면 바로 만듭니다. 태깅 안 된 경기가 남아 있어도 시작 후 7일이 지나면 그 경기만 빼고 만듭니다.'}));
    } else if (m.status === 'none') {
      card.appendChild(h('div', {class: 'hint', text: '월간 영상은 매달 1일 오전 9시에 지난달 것을 자동으로 만듭니다. 지금 만들 수도 있습니다.'}));
    } else if (working) {
      card.appendChild(h('div', {class: 'box info', text: '만드는 중입니다. 끝나면 BAND 글 알림이 오고 이 화면이 저절로 바뀝니다.'}));
    }
    if (d.untagged) {
      card.appendChild(h('div', {class: 'box info', text: '태깅 안 된 경기 ' + d.untagged + '개는 월간 영상에 들어가지 않습니다. 아래에서 경기를 눌러 태깅하세요.'}));
    }
    if (m.canBuild) {
      var asking = !!state.confirm.month;
      var label = m.status === 'waiting_tags' ? '태깅 안 된 경기 빼고 지금 만들기' : (m.status === 'none' ? '지금 만들기' : '월간 다시 만들기');
      card.appendChild(h('div', {class: 'bar'}, h('button', {class: 'primary', text: asking ? '한 번 더 누르면 시작합니다' : label,
        onclick: function () { askRebuild(); }}),
        m.status === 'done' || m.status === 'failed'
          ? h('span', {class: 'hint', text: '태깅을 고친 뒤 눌러 새로 만듭니다. 같은 이름의 옛 Drive 파일은 휴지통으로 갑니다.'}) : null));
    }
    out.push(card);

    out.push(h('h2', {text: '이 달의 경기'}));
    if (!d.games.length) out.push(h('p', {class: 'sub', text: '이 달에 분석이 끝난 경기가 없습니다.'}));
    d.games.forEach(function (g) {
      out.push(h('div', {class: 'card'},
        h('h3', {text: g.name}),
        h('div', {class: 'row'},
          h('span', {class: 'chip ' + (g.tagged ? 'ok' : 'warn'), text: g.tagged ? '태깅함' : '태깅 안 함'}),
          g.expired ? h('span', {class: 'chip bad', text: '클립 정리됨'}) : null,
          h('span', {class: 'sub', text: '월간 대상 ' + g.monthlyCount + '개 / 클립 ' + g.clipCount + '개'})),
        g.expired ? h('div', {class: 'hint', text: '클립이 보관 기간이 지나 정리돼 이 경기는 월간 영상을 다시 만들어도 들어가지 않습니다.'}) : null,
        h('div', {class: 'bar'}, h('button', {class: g.tagged ? '' : 'primary', text: g.tagged ? '태깅 보기·고치기' : '태깅하기',
          disabled: g.expired, onclick: function () { openDay(g.date); }}))));
    });
    app.replaceChildren.apply(app, out);
  }
  function askRebuild() {
    if (!state.confirm.month) {
      state.confirm.month = true; renderMonth();                         // 두 번 눌러야 시작(실수 방지)
      setTimeout(function () { if (state.confirm.month) { state.confirm.month = false; if (state.view === 'month') renderMonth(); } }, 5000);
      return;
    }
    state.confirm.month = false; state.busy.month = true; renderMonth();
    run('reviewRebuildMonth', state.month).then(function () {
      toast('월간 영상 만들기를 시작했습니다. 끝나면 BAND 글 알림이 옵니다.');
    }).catch(function (e) { toast('시작하지 못했습니다: ' + errText(e), true); }).then(function () {
      state.busy.month = false; loadMonth(false);
    });
  }

  // ── 하루 화면 ──
  function openDay(date) {
    stopPoll();
    state.view = 'day'; state.date = date; state.day = null; state.open = {}; state.busy = {}; state.confirm = {};
    document.getElementById('back').hidden = false;
    document.getElementById('title').textContent = fmtDate(date);
    app.replaceChildren(h('p', {class: 'sub', text: '불러오는 중…'}));
    loadDay(false);
  }
  function loadDay(quiet) {
    var date = state.date;
    return run('reviewGetDay', date).then(function (day) {
      if (state.view !== 'day' || state.date !== date) return;
      state.day = day; renderDay(); schedulePoll();
    }).catch(function (e) {
      if (quiet) return;
      app.replaceChildren(h('div', {class: 'box err', text: '불러오지 못했습니다: ' + errText(e)}));
    });
  }
  function renderDay() {
    var day = state.day;
    if (!day) return;
    var out = [];
    if (!day.games.length) out.push(h('p', {class: 'sub', text: '이 날짜에 분석이 끝난 경기가 없습니다.'}));
    day.games.forEach(function (g) { out.push(renderGame(g, day)); });
    var publishable = day.games.filter(function (g) { return g.publishable && ready(g); });
    if (publishable.length >= 2) {
      out.push(h('div', {class: 'bar'}, h('button', {class: 'primary', text: '준비된 경기 ' + publishable.length + '개 모두 게시',
        onclick: function () { publish(null); }})));
    }
    app.replaceChildren.apply(app, out);
  }
  function replaceGame(view) {
    for (var i = 0; i < state.day.games.length; i++) {
      if (state.day.games[i].label === view.label) { state.day.games[i] = view; break; }
    }
  }

  function renderGame(g, day) {
    var st = STATUS[g.status] || [g.status, ''];
    var card = h('article', {class: 'card' + (state.busy[g.label] ? ' busy' : '')});
    card.appendChild(h('h3', {text: g.name}));
    card.appendChild(h('div', {class: 'row'},
      h('span', {class: 'chip ' + st[1], text: st[0]}),
      h('span', {class: 'sub', text: '클립 ' + g.clipCount + '개 · 주간 영상 ' + fmtSec(g.weeklySec) +
        (g.kind ? ' · 월간 대상 ' + g.monthlyCount + '개' : '')})));
    if (g.status === 'pending' && g.autoAt) {
      card.appendChild(h('div', {class: 'hint', text: fmtAuto(g.autoAt) + '까지 게시하지 않으면 전체 장면으로 자동 게시됩니다.'}));
    }
    if (g.error) card.appendChild(h('div', {class: 'box err', text: '지난 게시 실패: ' + g.error}));
    if (g.ytUrl) card.appendChild(h('div', {class: 'row'}, h('a', {href: g.ytUrl, text: 'YouTube에서 보기 ↗', rel: 'noopener'})));
    if (!g.editable) {
      card.appendChild(h('div', {class: 'box info', text: '지금 게시 중입니다. 끝나면 이 화면이 저절로 바뀝니다.'}));
      return card;
    }

    // 경기 종류
    card.appendChild(h('div', {class: 'row'}, h('label', {text: '경기 종류'}),
      h('button', {class: 'seg', 'aria-pressed': g.kind === 'scrimmage', text: '청백전',
        onclick: function () { setGame(g, {kind: g.kind === 'scrimmage' ? null : 'scrimmage'}); }}),
      h('button', {class: 'seg', 'aria-pressed': g.kind === 'opponent', text: '다른 팀',
        onclick: function () { setGame(g, {kind: g.kind === 'opponent' ? null : 'opponent'}); }})));
    if (g.kind === 'opponent') {
      var input = h('input', {type: 'text', value: g.opponent, maxlength: 40, placeholder: '상대 팀 이름',
        'aria-label': '상대 팀 이름', 'data-opp': g.label, autocomplete: 'off',
        onchange: function (ev) { setGame(g, {opponent: ev.target.value}); }});
      input.value = g.opponent;
      var chips = (day.opponents || []).map(function (name) {
        return h('button', {text: name, onclick: function () { setGame(g, {opponent: name}); }});
      });
      card.appendChild(h('div', {class: 'row'}, h('label', {text: '상대 팀'}), input,
        chips.length ? h('div', {class: 'chips'}, chips) : null));
      if (g.hasEnd) {
        card.appendChild(h('div', {class: 'row'}, h('label', {text: '한울타리가 공격한 골대'}),
          h('button', {class: 'seg', 'aria-pressed': g.attackEnd === 'building', text: '건물 쪽',
            onclick: function () { setGame(g, {attack_end: g.attackEnd === 'building' ? null : 'building'}); }}),
          h('button', {class: 'seg', 'aria-pressed': g.attackEnd === 'tree', text: '나무 쪽',
            onclick: function () { setGame(g, {attack_end: g.attackEnd === 'tree' ? null : 'tree'}); }})));
      } else {
        card.appendChild(h('div', {class: 'hint', text: '월간 영상에 한울타리 장면만 담으려면 장면마다 공격/수비를 골라 주세요. 주간 영상에는 영향이 없습니다.'}));
      }
    }
    card.appendChild(h('div', {class: 'hint', text: '잘못 잡힘은 주간·월간 영상 모두에서 빠지고, 실점은 월간 영상에서만 빠집니다. 상대 득점 장면도 주간 영상에는 그대로 올라갑니다.'}));

    // 장면 목록
    var list = h('ul', {class: 'clips'});
    g.clips.forEach(function (c) { list.appendChild(renderClip(g, c)); });
    card.appendChild(list);
    if (g.kind === 'opponent' && g.clips.length && !g.clips.some(function (c) { return c.conceded; }) &&
        g.clips.some(function (c) { return c.side === 'defense'; })) {
      card.appendChild(h('div', {class: 'box info', text: '실점 장면이 없나요? 수비로 표시한 장면 중 골을 먹은 장면에 [실점]을 눌러 주세요. 그대로 게시해도 됩니다.'}));
    }

    // 게시
    if (g.publishable) card.appendChild(renderPublishBar(g));
    else card.appendChild(h('div', {class: 'hint', text: g.status === 'auto_published'
      ? '자동 게시된 경기입니다. 지금 태깅해도 월간 영상에 반영되고, 이름이 바뀌면 YouTube 제목도 고쳐집니다(영상은 다시 올리지 않습니다).'
      : '태그를 고치면 월간 영상에 반영되고, 이름이 바뀌면 YouTube 제목도 고쳐집니다.'}));
    return card;
  }

  function renderClip(g, c) {
    var key = g.label + ':' + c.idx, open = !!state.open[key];
    var tags = [];
    if (g.kind === 'opponent') {
      tags.push(h('button', {class: 'seg', 'aria-pressed': c.side === 'attack', text: '공격',
        onclick: function () { tagClip(g, c, {side_override: c.sideOverride === 'attack' ? null : 'attack'}); }}));
      tags.push(h('button', {class: 'seg', 'aria-pressed': c.side === 'defense', text: '수비',
        onclick: function () { tagClip(g, c, {side_override: c.sideOverride === 'defense' ? null : 'defense'}); }}));
      if (c.side === 'defense') {
        tags.push(h('button', {class: 'seg danger', 'aria-pressed': c.conceded, text: '실점',
          onclick: function () { tagClip(g, c, {conceded: !c.conceded}); }}));
      }
      if (g.hasEnd) {
        tags.push(h('button', {class: 'seg', 'aria-pressed': g.switchAtIdx === c.idx, text: '여기부터 반대',
          onclick: function () { setGame(g, {switch_at_idx: g.switchAtIdx === c.idx ? null : c.idx}); }}));
      }
    }
    tags.push(h('button', {class: 'seg danger', 'aria-pressed': c.removed, text: '잘못 잡힘',
      onclick: function () { tagClip(g, c, {removed: !c.removed}); }}));
    var monthly = g.kind
      ? h('span', {class: 'month' + (c.monthly ? ' in' : ''), text: c.monthly ? '월간 포함' : '월간 제외'}) : null;
    return h('li', {class: 'clip' + (c.removed ? ' removed' : '')},
      h('button', {class: 'title', 'aria-expanded': open, onclick: function () { state.open[key] = !open; renderDay(); },
        text: '#' + c.idx + ' · ' + (c.shots ? '슈팅 ' + c.shots + '회 · ' : '') + fmtSec(c.dur) +
          (c.peak != null ? ' · 원본 ' + fmtClock(c.peak) : '') + (open ? '  ▲' : '  ▼')}),
      open ? h('div', {class: 'preview'},
        h('iframe', {src: c.preview, allow: 'autoplay; fullscreen', allowfullscreen: true, title: '클립 ' + c.idx + ' 미리보기'}),
        h('a', {href: c.link, rel: 'noopener', text: 'Drive에서 열기 ↗'})) : null,
      h('div', {class: 'tags'}, tags, monthly));
  }

  function renderPublishBar(g) {
    var ok = ready(g), asking = !!state.confirm[g.label];
    var label = g.status === 'failed' ? '다시 게시' : '게시';
    var hint = !g.kind ? '경기 종류를 먼저 고르세요.' : (!ok ? '상대 팀 이름을 적어 주세요.' : '');
    return h('div', {class: 'bar'},
      h('button', {class: 'primary', disabled: !ok, text: asking ? '한 번 더 누르면 ' + label + '합니다 (' + fmtSec(g.weeklySec) + ')' : label,
        onclick: function () { askPublish(g); }}),
      hint ? h('span', {class: 'hint', text: hint}) : null);
  }

  // ── 동작: 눌렀을 때마다 서버에 저장하고, 서버가 돌려준 상태로 그 카드를 다시 그린다 ──
  function mutate(label, call) {
    state.busy[label] = true; renderDay();
    return call().then(function (view) { if (view) replaceGame(view); }).catch(function (e) {
      toast('저장하지 못했습니다: ' + errText(e), true);
    }).then(function () { state.busy[label] = false; if (state.view === 'day') renderDay(); });
  }
  function setGame(g, fields) { return mutate(g.label, function () { return run('reviewSetGame', g.date, g.label, fields); }); }
  function tagClip(g, c, tag) { return mutate(g.label, function () { return run('reviewTagClip', g.date, g.label, c.idx, tag); }); }

  function askPublish(g) {
    if (!state.confirm[g.label]) {
      state.confirm[g.label] = true; renderDay();                      // 두 번 눌러야 게시(실수 방지)
      setTimeout(function () { if (state.confirm[g.label]) { state.confirm[g.label] = false; if (state.view === 'day') renderDay(); } }, 5000);
      return;
    }
    state.confirm[g.label] = false;
    // 상대 이름을 입력하다 바로 게시를 눌렀을 때도 입력값이 먼저 저장되도록 같은 큐에 순서대로 넣는다
    var input = app.querySelector('input[data-opp="' + g.label + '"]');
    if (input && input.value !== g.opponent) setGame(g, {opponent: input.value});
    publish([g.label]);
  }
  function publish(labels) {
    state.day.games.forEach(function (g) { if (!labels || labels.indexOf(g.label) >= 0) state.busy[g.label] = true; });
    renderDay();
    run('reviewPublish', state.date, labels || []).then(function (out) {
      if (out.started.length) toast(out.started.length + '경기 게시를 시작했습니다. 끝나면 BAND 글 알림이 옵니다.');
      out.skipped.forEach(function (s) { toast(s.label + ': ' + s.reason, true); });
    }).catch(function (e) { toast('게시하지 못했습니다: ' + errText(e), true); }).then(function () {
      state.busy = {}; loadDay(false);
    });
  }

  // ── 게시 중이면 15초마다 새로 읽어 상태(게시 대기 → 게시 중 → 게시됨)를 보여 준다 ──
  function stopPoll() { clearInterval(state.poll); state.poll = null; }
  function schedulePoll() {
    var active = false, reload = null;
    if (state.view === 'day' && state.day) {
      active = state.day.games.some(function (g) { return g.status === 'publish' || g.status === 'running'; });
      reload = function () { loadDay(true); };
    } else if (state.view === 'month' && state.monthData) {
      active = state.monthData.monthly.status === 'build' || state.monthData.monthly.status === 'running';
      reload = function () { loadMonth(true); };
    }
    if (active && !state.poll) state.poll = setInterval(reload, 15000);
    if (!active) stopPoll();
  }

  document.getElementById('back').addEventListener('click', showList);
  document.getElementById('refresh').addEventListener('click', function () {
    if (state.view === 'day') loadDay(false); else if (state.view === 'month') loadMonth(false); else showList();
  });
  if (INITIAL && INITIAL.month) openMonth(INITIAL.month);
  else if (INITIAL && INITIAL.date) openDay(INITIAL.date);
  else showList();
})();
</script>
</body>
</html>
